# Build settings for the Netlify project hosting this site.

[build]
  base = "personal-site.web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router handles the routes, so anything without a file of its own
# serves index.html. This rule is deliberately not `force`d: `plugins/seo.ts`
# writes a real `about/index.html`, `experience/index.html` and so on, and
# Netlify serves an existing file in preference to an unforced rewrite. That is
# what gives each URL its own title, description and preview card before any
# JavaScript runs.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Crawlers should not be served a stale sitemap after a section is added.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
